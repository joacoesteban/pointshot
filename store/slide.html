<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pointshot</title>
    <style>
      @font-face {
        font-family: Outfit;
        font-weight: 100 900;
        src: url('/outfit.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      /* Chrome Web Store screenshots are 1280 × 800. */
      body {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family: Outfit, sans-serif;
        color: var(--tint);
        background: var(--backdrop);
      }
      [data-theme='lagoon'] {
        --backdrop: linear-gradient(135deg, #14b88a, #1668d8);
        --tint: #c9ffe9;
      }
      [data-theme='tide'] {
        --backdrop: linear-gradient(160deg, #1b8fe0, #4a35d4);
        --tint: #cfe6ff;
      }
      [data-theme='dusk'] {
        --backdrop: linear-gradient(135deg, #6a3fe0, #1a7fd4 70%, #16b393);
        --tint: #e2dcff;
      }
      [data-theme='reef'] {
        --backdrop: linear-gradient(200deg, #12a8a0, #2452c8);
        --tint: #cdfbf4;
      }
      [data-theme='deep'] {
        --backdrop: radial-gradient(circle at 50% 30%, #1d86d8, #2a3fb8 70%);
        --tint: #cfe6ff;
      }

      .copy {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #fff;
      }
      .brand img {
        width: 48px;
        height: 48px;
        filter: drop-shadow(0 6px 14px #0003);
      }
      h1 {
        font-size: 76px;
        font-weight: 300;
        line-height: 1.04;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }
      p {
        font-size: 29px;
        font-weight: 300;
        line-height: 1.25;
        text-wrap: balance;
      }
      p:empty {
        display: none;
      }
      b {
        font-weight: 800;
        color: #fff;
      }
      p b {
        font-weight: 600;
      }

      figure {
        position: absolute;
        overflow: hidden;
        border: 6px solid #ffffff59;
        border-radius: 22px;
        background-clip: padding-box;
        box-shadow: 0 36px 90px #0a123a66;
      }
      figure > img {
        display: block;
      }
      .cursor {
        position: absolute;
        width: 44px;
        height: 44px;
        /* The arrow's tip sits at 5, 3 of its 24 px box. */
        margin: -5.5px 0 0 -9.2px;
        filter: drop-shadow(0 3px 5px #0006);
      }

      [data-layout='right'] .copy,
      [data-layout='left'] .copy {
        top: 0;
        bottom: 0;
        width: 452px;
        justify-content: center;
      }
      [data-layout='right'] .copy {
        left: 64px;
      }
      [data-layout='right'] figure {
        top: 50%;
        right: 40px;
        translate: 0 -50%;
      }
      [data-layout='left'] .copy {
        right: 56px;
      }
      [data-layout='left'] figure {
        top: 50%;
        left: 40px;
        translate: 0 -50%;
      }

      [data-layout='top'] .copy,
      [data-layout='bottom'] .copy {
        left: 64px;
        right: 64px;
        gap: 12px;
      }
      [data-layout='top'] .brand,
      [data-layout='bottom'] .brand {
        display: none;
      }
      [data-layout='top'] h1,
      [data-layout='bottom'] h1 {
        font-size: 62px;
      }
      [data-layout='top'] .copy {
        bottom: 44px;
      }
      [data-layout='top'] figure {
        top: 36px;
        left: 50%;
        translate: -50% 0;
      }
      [data-layout='bottom'] .copy {
        top: 52px;
        align-items: center;
        text-align: center;
      }
      [data-layout='bottom'] figure {
        top: 250px;
        left: 50%;
        translate: -50% 0;
      }

      [data-layout='center'] .copy {
        inset: 0;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      [data-layout='center'] .brand {
        flex-direction: column;
        gap: 16px;
        margin-bottom: 12px;
        font-size: 40px;
      }
      [data-layout='center'] .brand img {
        width: 148px;
        height: 148px;
      }
      [data-layout='center'] h1 {
        font-size: 60px;
      }
    </style>
  </head>
  <body>
    <figure>
      <img class="shot" alt="" />
      <svg class="cursor" viewBox="0 0 24 24">
        <path
          d="M5 3v17.2l4.6-4.3 3 6.9 3-1.3-3-6.8h6.3z"
          fill="#111"
          stroke="#fff"
          stroke-width="1.5"
          stroke-linejoin="round" />
      </svg>
    </figure>
    <div class="copy">
      <div class="brand"><img src="/icon.png" alt="" />Pointshot</div>
      <h1></h1>
      <p></p>
    </div>
    <script>
      const params = new URLSearchParams(location.search)
      const bold = (text) => text.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      const figure = document.querySelector('figure')
      const cursor = document.querySelector('.cursor')
      const [x, y] = (params.get('cursor') ?? '').split(',')

      document.body.dataset.layout = params.get('layout') ?? 'center'
      document.body.dataset.theme = params.get('theme') ?? 'lagoon'
      document.querySelector('h1').innerHTML = bold(params.get('title') ?? '')
      document.querySelector('p').innerHTML = bold(params.get('body') ?? '')
      figure.hidden = !params.has('shot')
      if (params.has('shot'))
        document.querySelector('.shot').src = `/${params.get('shot')}.png`
      cursor.style.display = params.has('cursor') ? '' : 'none'
      cursor.style.left = `${x}px`
      cursor.style.top = `${y}px`
    </script>
  </body>
</html>
