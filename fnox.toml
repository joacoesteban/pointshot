[profiles.ci]
default_provider = "age"

# The first recipient is the publish workflow's key, whose identity is the
# FNOX_AGE_KEY repository secret; `mise run ci:key` replaces it. The second is
# the maintainer's Mac, the only place that can re-encrypt: its identity only
# unwraps in that Mac's Secure Enclave, and `mise run ci:mac-key` replaces it.
[profiles.ci.providers.age]
type = "age"
recipients = [
    "age1h6zd2xlxfs2snafqq6l9vpfuvl4awjp56uypcwpk07s65536vuxsrtmtlm",
    "age1tag1qgt2v70ym6k994v6qsnefm45ycfl2nk64zr09a6y6gckf006jw6dxatr4pa",
]
key_file = "age-se.txt"

[profiles.ci.providers.plain]
type = "plain"

[profiles.ci.secrets]
CHROME_PUBLISHER_ID= { provider = "plain", value = "33fae000-ca9f-4a7b-b5af-f0111b0e68ab" }
CHROME_EXTENSION_ID= { provider = "plain", value = "jajjpdfflgmbjcneconhhdmkgofffmio" }
CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL= { provider = "age", value = "" }
CHROME_SERVICE_ACCOUNT_PRIVATE_KEY= { provider = "age", value = "" }
FIREFOX_JWT_ISSUER= { provider = "age", value = "" }
FIREFOX_JWT_SECRET= { provider = "age", value = "" }
CHROME_API_VERSION= { provider = "plain", value = "v2" }
FIREFOX_EXTENSION_ID= { provider = "plain", value = "pointshot@joaco.io" }
FIREFOX_CHANNEL= { provider = "plain", value = "listed" }
CHROME_CANCEL_PENDING= { provider = "plain", value = "true" }
