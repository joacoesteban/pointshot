name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  pr_agent:
    permissions:
      checks: write
      contents: write
      issues: write
      pull-requests: write
    uses: joacoesteban/workflows/.github/workflows/pr-agent.yml@agent/pr-agent-thread-resolution
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
