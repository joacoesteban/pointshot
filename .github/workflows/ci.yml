name: ci
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit
      - run: bun run bundle:all
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - uses: actions/upload-artifact@v4
        with:
          name: snag
          path: build/*.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --generate-notes

  version:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Bump the patch version
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "$GITHUB_SHA is already released"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=$(bun pm version patch --message '%s')
          git push --atomic origin HEAD:main "$tag"
          # Tags pushed with GITHUB_TOKEN start no workflows, but
          # workflow_dispatch events do, so run the release on the tag by hand.
          gh workflow run ci.yml --ref "$tag"
