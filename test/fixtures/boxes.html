<!doctype html>
<html>
  <head>
    <title>Snag fixture</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        height: 2000px;
      }
      ::-webkit-scrollbar {
        width: 20px;
      }
      ::-webkit-scrollbar-thumb {
        background: #888888;
      }
      #parent {
        position: absolute;
        top: 120px;
        left: 80px;
        width: 400px;
        height: 300px;
        background: #3366ff;
      }
      #target {
        position: absolute;
        top: 90px;
        left: 100px;
        width: 200px;
        height: 120px;
        background: #ff3366;
      }
    </style>
  </head>
  <body>
    <div id="parent"><div id="target"></div></div>
    <svg
      id="logo"
      style="position: absolute; top: 450px; left: 80px"
      width="100"
      height="80">
      <rect width="100" height="80" fill="#22aa55" />
    </svg>
    <div
      id="below"
      style="
        position: absolute;
        top: 900px;
        left: 80px;
        width: 400px;
        height: 300px;
        background: #22aa55;
      "></div>
    <a id="link" href="#clicked">link</a>
    <div
      id="tall"
      style="
        position: absolute;
        top: 100px;
        left: 600px;
        width: 300px;
        height: 1500px;
        background: linear-gradient(#ff0000 0 50%, #0000ff 50% 100%);
      ">
      <div
        id="sticky"
        style="
          position: sticky;
          top: 0;
          margin-top: 680px;
          height: 40px;
          background: #000000;
        ">
        <div
          style="
            position: relative;
            z-index: -1;
            height: 10px;
            background: #00ff00;
          "></div>
      </div>
    </div>
    <div
      id="pill"
      style="
        position: absolute;
        top: 560px;
        left: 80px;
        width: 120px;
        height: 40px;
        border-radius: 20px;
        background: #aa22aa;
      "></div>
    <div
      id="scroller"
      style="
        position: absolute;
        top: 1300px;
        left: 80px;
        width: 200px;
        height: 150px;
        overflow: auto;
        background: #ffffff;
      ">
      <div
        id="list"
        style="
          width: 180px;
          height: 600px;
          background: linear-gradient(#ff0000 0 50%, #0000ff 50% 100%);
        "></div>
    </div>
    <div
      id="bubble"
      style="
        position: fixed;
        top: 600px;
        left: 700px;
        width: 50px;
        height: 50px;
        background: #000000;
      "></div>
  </body>
</html>
